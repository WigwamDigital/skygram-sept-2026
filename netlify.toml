# Netlify auto-detects Next.js and applies its Next.js runtime (OpenNext adapter).
[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"

# Old links point at www.skygram.ai — send them to the bare domain.
[[redirects]]
  from = "https://www.skygram.ai/*"
  to = "https://skygram.ai/:splat"
  status = 301
  force = true
